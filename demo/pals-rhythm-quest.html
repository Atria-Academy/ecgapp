<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<title>PALS Rhythm Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALS Rhythm Quest · co-branding STOP
   "Uma experiência educacional da STOP"
   Estética: monitor de UTI preservada, paleta STOP dessaturada.
   Sem amarelo, dourado ou laranja saturado. Verde do ECG separado
   semanticamente do verde de acerto.
   ============================================================ */

/* ---------- tokens ---------- */
:root {
  /* ---- Paleta-marca STOP (dessaturada, fechada) ---- */
  --stop-teal: #4BBEC1;         --stop-teal-soft: #7FCFD1;
  --stop-purple: #9E82D6;       --stop-purple-soft: #B7A3E2;
  --stop-coral: #E4788A;        --stop-coral-soft: #EFA3AF;
  --stop-green: #55C58F;        --stop-green-soft: #86D7B0;
  --stop-lavender: #C3B2E6;     --stop-lavender-soft: #D6CBEF;
  --stop-petrol: #5E9EC9;       --stop-petrol-soft: #8FBBDA;
  --stop-silver: #C6CFDA;       --stop-warm-white: #F3EEF7;

  /* ---- Fundos e superfícies (tema escuro STOP) ---- */
  --bg: #0A0E14;
  --bg-2: #0D131B;
  --surface: #111823;
  --surface-2: #16202C;
  --surface-3: #1D2A38;
  --line: #26364A;
  --line-soft: #1a2634;

  --ink: #E8EDF3;
  --ink-2: #9BA9B9;
  --ink-3: #61707F;

  /* ---- Tokens semânticos (um significado por cor) ---- */
  --success: var(--stop-green);          /* acerto / conclusão */
  --success-soft: var(--stop-green-soft);
  --success-dim: rgba(85, 197, 143, 0.14);
  --danger: var(--stop-coral);           /* erro / crítico / PCR */
  --danger-soft: var(--stop-coral-soft);
  --danger-dim: rgba(228, 120, 138, 0.14);
  --information: var(--stop-petrol);     /* casos / contexto / clínico */
  --information-soft: var(--stop-petrol-soft);
  --information-dim: rgba(94, 158, 201, 0.14);
  --progress: var(--stop-green);         /* barra de XP / mastery */
  --institutional: var(--stop-teal);     /* selo / chancela STOP */
  --institutional-dim: rgba(75, 190, 193, 0.14);
  --nivel: var(--stop-purple);           /* níveis / progressão / especial */
  --nivel-soft: var(--stop-purple-soft);
  --nivel-dim: rgba(158, 130, 214, 0.14);
  --reward: var(--stop-lavender);        /* moedas / XP / pódio / bônus */
  --reward-soft: var(--stop-lavender-soft);
  --reward-dim: rgba(195, 178, 230, 0.14);
  --reward-ink: var(--stop-warm-white);
  --streak: var(--stop-purple-soft);     /* sequência de dias (sem laranja) */
  --streak-dim: rgba(183, 163, 226, 0.14);
  --locked: #6B7C8E;                     /* bloqueado / indisponível */
  --locked-dim: rgba(107, 124, 142, 0.14);

  /* ---- Verde do ECG: variável própria, menos neon ---- */
  --ecg-signal: #46D6A2;
  --ecg-glow: rgba(70, 214, 162, 0.42);
  --ecg-grid: rgba(70, 214, 162, 0.05);
  --ecg-grid-strong: rgba(70, 214, 162, 0.09);

  /* ---- Aliases de compatibilidade (não quebram componentes) ---- */
  --ok: var(--success);
  --ok-ink: #05231a;
  --ok-dim: var(--success-dim);
  --info: var(--information);
  --info-dim: var(--information-dim);
  --bad: var(--danger);
  --bad-dim: var(--danger-dim);
  --signal: var(--progress);             /* verde de UI/progresso, não o traçado */

  --font-display: "Bricolage Grotesque", "Avenir Next", "Trebuchet MS", sans-serif;
  --font-body: "Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;

  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;

  --pad-page: 18px;
  --nav-h: 66px;
  --topbar-h: 60px;
}

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100dvh;
  overscroll-behavior-y: none;
}
img, canvas, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p { margin: 0; }
input, select {
  font: inherit; color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  width: 100%;
}
input:focus, select:focus { outline: 2px solid var(--ok); outline-offset: 1px; }
::selection { background: rgba(70, 214, 162, 0.25); }

/* ---------- tipografia utilitária ---------- */
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; }
.mono { font-family: var(--font-mono); }
.microlabel {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.section-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
}
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 26px 0 12px;
}
.section-head a { font-size: 13px; color: var(--ok); font-weight: 600; }

/* ---------- casca do app ---------- */
.app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(var(--topbar-h) + 12px) var(--pad-page) calc(var(--nav-h) + 28px);
}

/* barra superior */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--pad-page);
  background: rgba(7, 11, 16, 0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar-inner {
  width: 100%; max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-pulse {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  background: linear-gradient(145deg, #123a2c, #0c211b);
  border: 1px solid rgba(70, 214, 162, 0.35);
  display: grid; place-items: center;
  color: var(--ecg-signal);
}
.brand-lock { display: flex; flex-direction: column; min-width: 0; line-height: 1.05; }
.brand-name {
  font-family: var(--font-display);
  font-size: 15.5px; font-weight: 700; letter-spacing: 0.01em;
  white-space: nowrap;
}
.brand-name small { color: var(--success); }
/* logo STOP compacta ao lado da marca (só desktop; base fica antes da media query) */
.brand-desktop-logo {
  display: none; height: 26px; width: auto; margin-left: 12px;
  padding-left: 12px; border-left: 1px solid var(--line);
  opacity: 0.92; flex: none;
}
/* selo institucional discreto: "por STOP" (nunca a logo completa no header) */
.brand-by {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-mono); font-size: 8.5px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--institutional);
  white-space: nowrap;
}
.brand-by::before {
  content: ""; width: 4px; height: 4px; border-radius: 50%;
  background: var(--institutional); flex: none;
}
/* selo textual STOP para telas de concentração (perguntas): nunca a logo */
.stop-seal {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--institutional);
}
.stop-seal::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: var(--institutional); flex: none;
  box-shadow: 0 0 7px rgba(75, 190, 193, 0.6);
}
.topbar-stats { display: flex; align-items: center; gap: 8px; }
.stat-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 600;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  white-space: nowrap;
}
.stat-pill .ic { width: 14px; height: 14px; }
.stat-pill.coins { color: var(--reward); border-color: rgba(195, 178, 230, 0.3); }
.stat-pill.streak { color: var(--streak); border-color: rgba(183, 163, 226, 0.3); }

/* navegação inferior */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  background: rgba(9, 14, 20, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line-soft);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bottomnav-inner {
  max-width: 560px; margin: 0 auto;
  height: var(--nav-h);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.navitem {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3);
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
  transition: color 0.15s ease;
}
.navitem .ic { width: 22px; height: 22px; }
.navitem.active { color: var(--signal); }
.navitem.active .navdot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--signal);
  box-shadow: 0 0 8px var(--signal);
}
.navdot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-lg);
  padding: 18px;
}
.card + .card { margin-top: 14px; }
.card-tight { padding: 14px; }

/* moldura de telemetria (cantos) para áreas de ECG */
.scope {
  position: relative;
  background: #050a0e;
  border: 1px solid #14251f;
  border-radius: var(--r-md);
  overflow: hidden;
}
.scope::after {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 100% 3px;
  mix-blend-mode: overlay;
}
.scope canvas { width: 100%; height: 100%; }
.scope-label {
  position: absolute; top: 8px; left: 10px; z-index: 2;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: rgba(70, 214, 162, 0.55);
}
.scope-hr {
  position: absolute; top: 8px; right: 10px; z-index: 2;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  color: rgba(70, 214, 162, 0.8);
  display: flex; align-items: center; gap: 5px;
}
.scope-hr .beat-heart { color: var(--signal); animation: heartbeat 1s infinite; display: inline-block; }
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  12% { transform: scale(1.25); }
  24% { transform: scale(1); }
}

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px;
  padding: 12px 20px;
  border-radius: var(--r-md);
  font-family: var(--font-display);
  font-size: 15.5px; font-weight: 700;
  transition: transform 0.12s ease, filter 0.15s ease, background 0.15s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--ok); color: var(--ok-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost {
  background: transparent; color: var(--ink-2);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-info { background: var(--info); color: #071224; }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 8px 14px; font-size: 13.5px; border-radius: var(--r-sm); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.04em;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2);
  background: var(--surface-2);
  white-space: nowrap;
}
.chip.ok { color: var(--success); border-color: rgba(85,197,143,0.4); background: var(--success-dim); }
.chip.info { color: var(--information-soft); border-color: rgba(94,158,201,0.4); background: var(--info-dim); }
.chip.reward { color: var(--reward); border-color: rgba(195,178,230,0.45); background: var(--reward-dim); }
.chip.bad { color: var(--danger); border-color: rgba(228,120,138,0.4); background: var(--bad-dim); }
.chip.institutional { color: var(--institutional); border-color: rgba(75,190,193,0.45); background: var(--institutional-dim); }
.chip.nivel { color: var(--nivel-soft); border-color: rgba(158,130,214,0.45); background: var(--nivel-dim); }
.chip.locked { color: var(--locked); border-color: rgba(107,124,142,0.4); background: var(--locked-dim); }

.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }

/* filtros (segmented) */
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter-btn {
  flex: none;
  font-size: 13px; font-weight: 600;
  padding: 8px 16px; border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ink-2); background: var(--surface);
  transition: all 0.15s ease;
}
.filter-btn.active { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }

/* ---------- barra de XP ---------- */
.xpbar { display: flex; flex-direction: column; gap: 6px; }
.xpbar-meta {
  display: flex; justify-content: space-between;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3);
}
.xpbar-track {
  height: 10px; border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
}
.xpbar-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #3E9E77, var(--progress));
  box-shadow: 0 0 10px rgba(85, 197, 143, 0.32);
  transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
  min-width: 6px;
}

/* barra de progresso genérica */
.meter { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter > i {
  display: block; height: 100%; border-radius: 999px;
  background: var(--progress);
  transition: width 0.6s ease;
}
.meter.reward > i { background: var(--reward); }
.meter.nivel > i { background: var(--nivel); }
.meter.info > i { background: var(--info); }
.meter.bad > i { background: var(--bad); }

/* ---------- home ---------- */
.hero {
  position: relative;
  border-radius: var(--r-lg);
  border: 1px solid var(--line-soft);
  background:
    radial-gradient(120% 140% at 85% -20%, rgba(85, 197, 143, 0.14), transparent 55%),
    var(--surface);
  padding: 20px 18px 18px;
  overflow: hidden;
}
.hero .microlabel { color: rgba(70, 214, 162, 0.6); display: flex; align-items: center; gap: 7px; }
.hero .live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ecg-signal);
  box-shadow: 0 0 10px var(--ecg-signal);
  animation: blink 2.2s infinite;
}
/* assinatura de co-branding no hero */
.hero-signature {
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 14px;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--institutional);
}
.hero-signature::before {
  content: ""; width: 16px; height: 1px; background: rgba(75, 190, 193, 0.5); flex: none;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(26px, 7vw, 34px);
  line-height: 1.08; font-weight: 800; letter-spacing: -0.015em;
  margin: 10px 0 8px;
}
.hero h1 em { font-style: normal; color: var(--signal); }
.hero p.sub { color: var(--ink-2); font-size: 14.5px; max-width: 46ch; }
.hero-scope { margin-top: 16px; height: 96px; }
.hero-cta { display: flex; gap: 10px; margin-top: 16px; }
.hero-cta .btn { flex: 1; }

/* card de nível na home */
.levelcard { display: flex; flex-direction: column; gap: 12px; }
.levelcard-top { display: flex; align-items: center; gap: 13px; }
.avatar {
  width: 52px; height: 52px; border-radius: 16px; flex: none;
  display: grid; place-items: center;
  font-size: 26px;
  background: var(--surface-3);
  border: 1px solid var(--line);
}
.avatar.lg { width: 68px; height: 68px; border-radius: 20px; font-size: 34px; }
.levelcard-id { min-width: 0; flex: 1; }
.levelcard-id .name {
  font-family: var(--font-display); font-weight: 700; font-size: 17px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.levelcard-id .title { font-size: 12.5px; color: var(--ok); font-weight: 600; }
.levelbubble {
  flex: none; text-align: center;
  font-family: var(--font-mono);
  border: 1px solid rgba(85, 197, 143, 0.4);
  background: var(--ok-dim);
  border-radius: 12px; padding: 6px 12px;
}
.levelbubble b { display: block; font-size: 19px; color: var(--signal); line-height: 1.1; }
.levelbubble span { font-size: 9.5px; letter-spacing: 0.12em; color: var(--ink-3); text-transform: uppercase; }

/* estatísticas rápidas */
.stat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-tile {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  padding: 13px 12px 11px;
}
.stat-tile b {
  display: block;
  font-family: var(--font-mono); font-size: 21px; font-weight: 600;
  line-height: 1.15; color: var(--ink);
}
.stat-tile b small { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.stat-tile span { font-size: 11px; color: var(--ink-3); letter-spacing: 0.03em; }
.stat-tile.t-ok b { color: var(--success); }
.stat-tile.t-reward b { color: var(--reward); }
.stat-tile.t-fire b { color: var(--streak); }
.stat-tile.t-info b { color: var(--information-soft); }

/* ---------- cards de modo ---------- */
.modegrid { display: grid; gap: 12px; }
.modecard {
  position: relative;
  display: block;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-lg);
  padding: 17px 17px 15px;
  overflow: hidden;
  transition: transform 0.15s ease, border-color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.modecard:active { transform: scale(0.985); }
.modecard::before {
  content: "";
  position: absolute; left: 0; top: 14px; bottom: 14px;
  width: 3px; border-radius: 0 3px 3px 0;
  background: var(--mode-color, var(--ok));
}
.modecard-head { display: flex; align-items: center; gap: 12px; }
.modecard-icon {
  width: 44px; height: 44px; flex: none;
  border-radius: 13px;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--mode-color, var(--ok)) 13%, transparent);
  color: var(--mode-color, var(--ok));
}
.modecard-icon .ic { width: 23px; height: 23px; }
.modecard-title { flex: 1; min-width: 0; }
.modecard-title .microlabel { color: var(--mode-color, var(--ok)); opacity: 0.8; font-size: 10px; }
.modecard-title h3 { font-family: var(--font-display); font-size: 17.5px; font-weight: 700; }
.modecard p.desc { color: var(--ink-2); font-size: 13.5px; margin-top: 9px; line-height: 1.45; }
.modecard-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 12px; gap: 8px;
}
.modecard-foot .chiprow { flex: 1; }
.modecard-best { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.modecard.locked { opacity: 0.85; }
.modecard.locked .modecard-icon { background: var(--surface-3); color: var(--ink-3); }
.locktag {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  color: var(--ink-3);
  border: 1px dashed var(--line);
  padding: 4px 10px; border-radius: 999px;
}

/* seletor pré-partida */
.setup-row { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 3px; gap: 3px;
}
.seg button {
  padding: 9px 6px; border-radius: 7px;
  font-size: 13px; font-weight: 600; color: var(--ink-3);
  transition: all 0.15s ease;
}
.seg button.active { background: var(--surface-3); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

/* ---------- tela de partida ---------- */
.game-shell { max-width: 560px; margin: 0 auto; padding: 12px var(--pad-page) 30px; min-height: 100dvh; display: flex; flex-direction: column; }
.game-top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 12px;
}
.game-exit {
  width: 40px; height: 40px; flex: none;
  border-radius: 12px; border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--ink-3);
  background: var(--surface);
}
.game-progress { flex: 1; }
.game-progress .meter { height: 6px; }
.game-progress .microlabel { margin-bottom: 5px; display: block; text-align: center; }

.hud {
  display: flex; align-items: stretch; gap: 8px;
  margin-bottom: 12px;
}
.hud-box {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  padding: 8px 10px;
  text-align: center;
}
.hud-box .microlabel { font-size: 9px; display: block; }
.hud-box b { font-family: var(--font-mono); font-size: 17px; font-weight: 600; }
.hud-box.h-xp b { color: var(--signal); }
.hud-box.h-coin b { color: var(--reward); }
.hud-box.h-combo b { color: var(--ink); }
.hud-box.h-combo.hot { border-color: rgba(195, 178, 230, 0.5); background: var(--reward-dim); }
.hud-box.h-combo.hot b { color: var(--reward); }
.hud-box.h-combo.hot.shake { animation: comboshake 0.35s ease; }
@keyframes comboshake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-2px) rotate(-0.6deg); }
  60% { transform: translateX(2px) rotate(0.6deg); }
}

/* anel do cronômetro */
.timer-ring { position: relative; width: 54px; height: 54px; flex: none; }
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-ring .track { stroke: var(--surface-3); }
.timer-ring .arc { stroke: var(--success); transition: stroke 0.3s; }
.timer-ring.warn .arc { stroke: var(--information); }
.timer-ring.danger .arc { stroke: var(--danger); }
.timer-ring b {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 15px; font-weight: 600;
}

.game-strip { height: 168px; margin-bottom: 6px; }
.strip-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin: 8px 2px 14px;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-3);
}

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answer-btn {
  min-height: 62px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
  font-family: var(--font-display);
  font-size: 14.5px; font-weight: 600;
  line-height: 1.25;
  text-align: center;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.answer-btn:active { transform: scale(0.97); }
.answer-btn.correct {
  background: var(--ok-dim); border-color: var(--ok); color: var(--signal);
  animation: pulse-ok 0.5s ease;
}
.answer-btn.wrong {
  background: var(--bad-dim); border-color: var(--bad); color: var(--bad);
  animation: wrongshake 0.4s ease;
}
.answer-btn.faded { opacity: 0.35; }
@keyframes pulse-ok {
  0% { box-shadow: 0 0 0 0 rgba(85, 197, 143, 0.5); }
  100% { box-shadow: 0 0 0 16px rgba(85, 197, 143, 0); }
}
@keyframes wrongshake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  80% { transform: translateX(-3px); }
}

/* caso clínico (Plantão) */
.casecard {
  background: linear-gradient(180deg, rgba(79, 140, 255, 0.08), transparent 70%), var(--surface);
  border: 1px solid rgba(79, 140, 255, 0.25);
  border-radius: var(--r-md);
  padding: 14px;
  margin-bottom: 12px;
}
.casecard .microlabel { color: var(--information-soft); margin-bottom: 6px; display: block; }
.casecard p { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.casecard p b { color: var(--ink); }
.case-vitals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* ---------- feedback sheet ---------- */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(4, 7, 10, 0.7);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
  max-width: 560px; margin: 0 auto;
  max-height: 86dvh;
  overflow-y: auto;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
  padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0));
  transform: translateY(105%);
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
}
.sheet.open { transform: translateY(0); }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 14px; }
.verdict {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px; border-radius: var(--r-md);
  margin-bottom: 14px;
}
.verdict.ok { background: var(--ok-dim); border: 1px solid rgba(85, 197, 143, 0.35); }
.verdict.bad { background: var(--bad-dim); border: 1px solid rgba(228, 120, 138, 0.35); }
.verdict-icon {
  width: 40px; height: 40px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
}
.verdict.ok .verdict-icon { background: var(--ok); color: var(--ok-ink); }
.verdict.bad .verdict-icon { background: var(--bad); color: #2a0a0e; }
.verdict h3 { font-family: var(--font-display); font-size: 18px; }
.verdict .microlabel { font-size: 10px; margin-top: 1px; }
.verdict.ok .microlabel { color: var(--ok); }
.verdict.bad .microlabel { color: var(--bad); }

.gainrow { display: flex; gap: 8px; margin-bottom: 14px; }
.gain {
  flex: 1; text-align: center;
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--r-md); padding: 9px 6px;
}
.gain b { font-family: var(--font-mono); font-size: 16.5px; display: block; }
.gain span { font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.gain.g-xp b { color: var(--signal); }
.gain.g-coin b { color: var(--reward); }
.gain.g-speed b { color: var(--information-soft); }
.gain.g-neg b { color: var(--bad); }

.teachblock { margin-bottom: 13px; }
.teachblock .microlabel { display: block; margin-bottom: 7px; }
.teachblock ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.teachblock li {
  font-size: 13.5px; color: var(--ink-2); line-height: 1.45;
  padding-left: 18px; position: relative;
}
.teachblock li::before {
  content: ""; position: absolute; left: 2px; top: 8px;
  width: 6px; height: 6px; border-radius: 2px;
  background: var(--ok);
}
.teachblock.warn li::before { background: var(--information); border-radius: 50%; }
.teachblock.trap li::before { background: var(--bad); border-radius: 50%; }
.tipbox {
  background: var(--information-dim);
  border: 1px solid rgba(94, 158, 201, 0.28);
  border-radius: var(--r-md);
  padding: 12px 14px;
  font-size: 13.5px; color: #c4dbec; line-height: 1.5;
  margin-bottom: 14px;
}
.tipbox b { color: var(--information-soft); }
.compare {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;
}
.compare > div {
  border-radius: var(--r-md); padding: 10px 12px;
  font-size: 13px; line-height: 1.3;
}
.compare .yours { background: var(--bad-dim); border: 1px solid rgba(228, 120, 138, 0.35); }
.compare .right { background: var(--ok-dim); border: 1px solid rgba(85, 197, 143, 0.3); }
.compare .microlabel { font-size: 9px; display: block; margin-bottom: 3px; }
.compare .yours .microlabel { color: var(--bad); }
.compare .right .microlabel { color: var(--ok); }
.compare b { font-family: var(--font-display); font-size: 14px; }

/* ---------- resultado da rodada ---------- */
.result-hero { text-align: center; padding: 26px 0 8px; }
.result-hero h2 { font-family: var(--font-display); font-size: 26px; font-weight: 800; }
.result-hero .microlabel { margin-top: 4px; }
.ring-wrap { position: relative; width: 158px; height: 158px; margin: 18px auto; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-wrap .ringtrack { stroke: var(--surface-3); }
.ring-wrap .ringarc { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(0.22, 1, 0.36, 1); }
.ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-center b { font-family: var(--font-mono); font-size: 34px; font-weight: 600; color: var(--signal); }
.ring-center span { font-size: 11px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; }
.bonusline {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13.5px; color: var(--ink-2);
}
.bonusline:last-child { border-bottom: 0; }
.bonusline b { font-family: var(--font-mono); color: var(--signal); }
.bonusline b.reward { color: var(--reward); }

/* ---------- ranking ---------- */
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 10px; align-items: end; margin-bottom: 16px; }
.podium-card {
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  padding: 14px 8px 12px;
  position: relative;
}
.podium-card.first {
  border-color: rgba(195, 178, 230, 0.4);
  background: linear-gradient(180deg, rgba(195, 178, 230, 0.1), transparent 65%), var(--surface);
  padding-top: 20px; padding-bottom: 16px;
}
.podium-medal {
  position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  background: var(--surface-3); color: var(--ink-2);
}
.podium-card.first .podium-medal { background: var(--reward); color: #2c2340; border-color: var(--reward); }
.podium-card.second .podium-medal { background: var(--stop-silver); color: #232c36; border-color: var(--stop-silver); }
.podium-card.third .podium-medal { background: var(--stop-coral-soft); color: #3a1f24; border-color: var(--stop-coral-soft); }
.podium-card .avatar { margin: 2px auto 7px; width: 44px; height: 44px; font-size: 22px; border-radius: 14px; }
.podium-card.first .avatar { width: 54px; height: 54px; font-size: 27px; }
.podium-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.podium-pts { font-family: var(--font-mono); font-size: 12px; color: var(--reward); margin-top: 2px; }

.ranklist { display: flex; flex-direction: column; }
.rankrow {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px;
  border-bottom: 1px solid var(--line-soft);
}
.rankrow:last-child { border-bottom: 0; }
.rankpos { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); width: 26px; text-align: center; flex: none; }
.rankrow .avatar { width: 38px; height: 38px; font-size: 19px; border-radius: 12px; }
.rankmain { flex: 1; min-width: 0; }
.rankmain .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rankmain .sub { font-size: 11px; color: var(--ink-3); }
.rankpts { font-family: var(--font-mono); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.rankrow.me {
  background: var(--ok-dim);
  border: 1px solid rgba(85, 197, 143, 0.35);
  border-radius: var(--r-md);
  margin: 4px 0;
}
.rankrow.me .name { color: var(--signal); }
.rankrow.me .rankpts { color: var(--signal); }
.rankdelta { font-family: var(--font-mono); font-size: 10.5px; flex: none; width: 34px; text-align: right; }
.rankdelta.up { color: var(--ok); }
.rankdelta.down { color: var(--bad); }
.rankdelta.same { color: var(--ink-3); }

/* ---------- emblemas ---------- */
.badgegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.badgetile {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-lg);
  padding: 16px 14px 14px;
  text-align: center;
  transition: transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.badgetile:active { transform: scale(0.97); }
.badge-emoji {
  width: 58px; height: 58px; margin: 0 auto 10px;
  border-radius: 18px;
  display: grid; place-items: center;
  font-size: 29px;
  background: var(--surface-3);
  border: 1px solid var(--line);
}
.badgetile.unlocked .badge-emoji {
  background: linear-gradient(150deg, rgba(195, 178, 230, 0.2), rgba(195, 178, 230, 0.05));
  border-color: rgba(195, 178, 230, 0.45);
  box-shadow: 0 0 18px rgba(195, 178, 230, 0.12);
}
.badgetile.locked .badge-emoji { filter: grayscale(1); opacity: 0.4; }
.badgetile h4 { font-family: var(--font-display); font-size: 14px; font-weight: 700; line-height: 1.2; }
.badgetile .microlabel { font-size: 9px; margin-top: 5px; display: block; }
.badgetile.unlocked .microlabel { color: var(--reward); }
.badgetile .meter { margin-top: 9px; }
.badgetile.fresh .badge-emoji { animation: badgeflip 0.9s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes badgeflip {
  0% { transform: rotateY(180deg) scale(0.6); opacity: 0; }
  100% { transform: rotateY(0) scale(1); opacity: 1; }
}
/* emblema chancelado pela STOP: moldura roxo + turquesa, sem dourado */
.badgetile.special { border-color: rgba(75, 190, 193, 0.4); }
.badgetile.special.unlocked .badge-emoji {
  background: linear-gradient(150deg, rgba(158, 130, 214, 0.22), rgba(75, 190, 193, 0.14));
  border-color: rgba(75, 190, 193, 0.5);
  box-shadow: 0 0 18px rgba(75, 190, 193, 0.14);
}
.badge-stoptag {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 6px;
  font-family: var(--font-mono); font-size: 8.5px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--institutional);
  border: 1px solid rgba(75, 190, 193, 0.4);
  border-radius: 999px; padding: 2px 7px;
}

/* ---------- biblioteca ---------- */
.rhythmcard {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 14px;
  -webkit-tap-highlight-color: transparent;
}
.rhythmcard .scope { border-radius: 0; border: 0; border-bottom: 1px solid #14251f; height: 92px; }
.rhythmcard-body { padding: 13px 15px 14px; }
.rhythmcard-body h3 { font-family: var(--font-display); font-size: 16.5px; font-weight: 700; }
.rhythmcard-body .en { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-bottom: 8px; }

.kvgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 13px 0; }
.kv {
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-sm);
  padding: 8px 11px;
}
.kv .microlabel { font-size: 9px; display: block; }
.kv b { font-size: 13px; font-weight: 600; line-height: 1.25; display: block; margin-top: 2px; }

/* dificuldade */
.diff { display: inline-flex; gap: 3px; align-items: center; }
.diff i { width: 6px; height: 6px; border-radius: 2px; background: var(--surface-3); }
.diff i.on { background: var(--reward); }

/* ---------- dashboard ---------- */
.masteryrow { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.masteryrow .mname { flex: 1.5; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.masteryrow .meter { flex: 1; min-width: 64px; }
.masteryrow .mval { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); width: 40px; text-align: right; flex: none; }
.masteryrow.weak .mval { color: var(--bad); }
.masteryrow.weak .meter > i { background: var(--bad); }

.errorrow {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line-soft);
}
.errorrow:last-child { border-bottom: 0; }
.errorrow .err-ic {
  width: 36px; height: 36px; flex: none; border-radius: 11px;
  background: var(--bad-dim); color: var(--bad);
  display: grid; place-items: center;
}
.errorrow .body { flex: 1; min-width: 0; }
.errorrow .body b { font-size: 13.5px; display: block; }
.errorrow .body span { font-size: 11.5px; color: var(--ink-3); }

/* ---------- modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(4, 7, 10, 0.75);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: grid; place-items: center;
  padding: 22px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s ease;
}
.modal-backdrop.open { opacity: 1; pointer-events: auto; }
.modal {
  width: 100%; max-width: 400px;
  max-height: 84dvh; overflow-y: auto;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px 20px;
  transform: translateY(14px) scale(0.97);
  transition: transform 0.22s ease;
}
.modal-backdrop.open .modal { transform: translateY(0) scale(1); }

/* ---------- toast ---------- */
.toastwrap {
  position: fixed; top: calc(var(--topbar-h) + 10px); left: 0; right: 0; z-index: 90;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
  padding: 0 18px;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-3);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 13.5px; font-weight: 600;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  animation: toastin 0.35s cubic-bezier(0.34, 1.3, 0.64, 1);
}
.toast.reward { border-color: rgba(195, 178, 230, 0.45); color: var(--reward); }
.toast.ok { border-color: rgba(85, 197, 143, 0.4); color: var(--success); }
.toast.institutional { border-color: rgba(75, 190, 193, 0.45); color: var(--institutional); }
@keyframes toastin {
  from { opacity: 0; transform: translateY(-12px) scale(0.92); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.toast.out { animation: toastout 0.3s ease forwards; }
@keyframes toastout { to { opacity: 0; transform: translateY(-10px) scale(0.94); } }

/* ---------- partículas de moeda/XP ---------- */
.burst-layer { position: fixed; inset: 0; z-index: 95; pointer-events: none; overflow: hidden; }
.coin-p {
  position: absolute;
  font-family: var(--font-mono); font-size: 15px; font-weight: 700;
  color: var(--reward);
  text-shadow: 0 0 10px rgba(195, 178, 230, 0.5);
  animation: coinfly 0.95s cubic-bezier(0.2, 0.7, 0.4, 1) forwards;
}
.coin-p.xp { color: var(--stop-silver); text-shadow: 0 0 10px rgba(198, 207, 218, 0.5); }
@keyframes coinfly {
  0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
  15% { opacity: 1; transform: translate(var(--dx0, 0), -14px) scale(1.15); }
  100% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, -90px)) scale(0.85); }
}

/* ---------- aviso clínico ---------- */
.disclaimer {
  margin-top: 26px;
  border: 1px solid rgba(228, 120, 138, 0.3);
  border-left: 3px solid var(--stop-coral-soft);
  border-radius: var(--r-md);
  padding: 13px 15px;
  font-size: 12px; color: var(--ink-3); line-height: 1.55;
}
.disclaimer b { color: var(--stop-coral-soft); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

/* ---------- util ---------- */
.mt-0 { margin-top: 0; } .mt-8 { margin-top: 8px; } .mt-14 { margin-top: 14px; } .mt-20 { margin-top: 20px; }
.mb-8 { margin-bottom: 8px; } .mb-14 { margin-bottom: 14px; }
.muted { color: var(--ink-3); } .small { font-size: 13px; }
.txt-ok { color: var(--success); } .txt-reward { color: var(--reward); } .txt-bad { color: var(--danger); } .txt-info { color: var(--information-soft); }
.txt-institutional { color: var(--institutional); } .txt-nivel { color: var(--nivel-soft); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }
.hidden { display: none !important; }

/* contagem animada */
.countup { font-variant-numeric: tabular-nums; }

/* ---------- splash institucional (só no primeiro acesso) ---------- */
.splash {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; padding: 32px;
  background:
    radial-gradient(120% 90% at 50% 30%, rgba(75, 190, 193, 0.08), transparent 60%),
    var(--bg);
  text-align: center;
  transition: opacity 0.5s ease;
}
.splash.out { opacity: 0; pointer-events: none; }
.splash-apresenta {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-3);
  opacity: 0; animation: splashUp 0.55s ease 0.15s forwards;
}
.splash-logo {
  width: min(240px, 62vw); height: auto;
  opacity: 0; animation: splashUp 0.6s ease 0.35s forwards;
}
.splash-game {
  opacity: 0; animation: splashUp 0.6s ease 0.85s forwards;
}
.splash-game h1 {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(24px, 7vw, 32px); letter-spacing: -0.015em; color: var(--ink);
}
.splash-game .brand-by { justify-content: center; margin-top: 6px; font-size: 10px; }
.splash-line {
  font-size: 13px; color: var(--ink-2); max-width: 34ch;
  opacity: 0; animation: splashUp 0.6s ease 1.1s forwards;
}
.splash-skip {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0)); right: 18px;
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  color: var(--ink-3);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 14px; min-height: 40px;
}
.splash-skip:hover { color: var(--ink); border-color: var(--ink-3); }
@keyframes splashUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Desafio STOP da semana ---------- */
.challenge {
  position: relative;
  border-radius: var(--r-lg);
  border: 1px solid rgba(75, 190, 193, 0.28);
  background:
    radial-gradient(130% 120% at 100% 0%, rgba(75, 190, 193, 0.12), transparent 55%),
    var(--surface);
  padding: 18px;
  overflow: hidden;
}
.challenge-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.challenge-mark {
  width: 40px; height: 40px; flex: none; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--institutional-dim);
  border: 1px solid rgba(75, 190, 193, 0.4);
  color: var(--institutional);
}
.challenge-head .grow .microlabel { color: var(--institutional); }
.challenge-head h3 { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.challenge-strip { height: 74px; margin: 12px 0; }
.challenge-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.challenge-cta { display: flex; align-items: center; gap: 10px; }
.challenge-cta .btn { flex: 1; }
.challenge-reward {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--reward);
  white-space: nowrap;
}

/* ---------- rodapé institucional ---------- */
.instfooter {
  margin-top: 30px;
  border-top: 1px solid var(--line-soft);
  padding-top: 22px;
  display: flex; flex-direction: column; gap: 14px;
}
.instfooter-brand { display: flex; align-items: center; gap: 13px; }
.instfooter-logo { width: 72px; height: auto; flex: none; }
.instfooter-org .microlabel { color: var(--institutional); display: block; margin-bottom: 2px; }
.instfooter-org b {
  font-family: var(--font-display); font-size: 14.5px; font-weight: 700;
  color: var(--ink); line-height: 1.25; display: block;
}
.instfooter-org span { font-size: 12px; color: var(--ink-3); }

/* ---------- responsivo: tablet / desktop ---------- */
@media (min-width: 760px) {
  :root { --pad-page: 28px; }
  .app, .topbar-inner, .bottomnav-inner, .game-shell, .sheet { max-width: 700px; }
  .badgegrid { grid-template-columns: repeat(3, 1fr); }
  .answers { gap: 12px; }
  .answer-btn { min-height: 68px; font-size: 15.5px; }
  .game-strip { height: 200px; }
  .hero-scope { height: 120px; }
}
@media (min-width: 1060px) {
  .app, .topbar-inner, .game-shell { max-width: 960px; }
  .bottomnav { display: none; }
  .topnav-links { display: flex !important; }
  .app { padding-bottom: 60px; }
  .modegrid { grid-template-columns: 1fr 1fr; }
  .badgegrid { grid-template-columns: repeat(4, 1fr); }
  .librarygrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .librarygrid .rhythmcard { margin-bottom: 0; }
  .dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .dash-cols .card + .card { margin-top: 0; }
  .sheet { max-width: 620px; border-radius: 22px; bottom: 24px; border-bottom: 1px solid var(--line); }
  /* no desktop o selo STOP ganha espaço ao lado da marca */
  .brand-by { font-size: 9.5px; }
  .brand-desktop-logo { display: block; }
}

/* small screens: proteger moedas e sequência de overflow no header */
@media (max-width: 400px) {
  .brand-by { display: none; }
  .brand-name { font-size: 15px; }
  .stat-pill { font-size: 12px; padding: 5px 9px; }
}

/* links de navegação no topo (desktop) */
.topnav-links { display: none; align-items: center; gap: 4px; }
.topnav-links a {
  font-size: 13.5px; font-weight: 600; color: var(--ink-2);
  padding: 7px 13px; border-radius: 999px;
}
.topnav-links a:hover { background: var(--surface-2); color: var(--ink); }
.topnav-links a.active { color: var(--success); background: var(--ok-dim); }

/* redução de movimento */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ============================================================
   MONITOR DE SIMULAÇÃO (modo apresentador) · monitor.html
   ============================================================ */
body.mon-page { background: #05080c; }
.mon-wrap { max-width: 1160px; margin: 0 auto; padding: 12px 14px 44px; }

.mon-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 2px 12px;
}
.mon-back {
  font-weight: 700; font-size: 14px; color: var(--ink-2);
  padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); white-space: nowrap;
}
.mon-back:hover { color: var(--ink); border-color: var(--ink-3); }
.mon-title { font-weight: 800; font-size: 15px; color: var(--ink); }
.mon-title small { display: block; font-weight: 600; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.mon-bar-actions { margin-left: auto; display: flex; gap: 8px; }

/* --- botões genéricos do monitor --- */
.mon-btn {
  font-family: inherit; font-weight: 700; font-size: 13.5px;
  padding: 9px 15px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer;
  transition: transform .08s, border-color .15s, background .15s;
}
.mon-btn:hover { border-color: var(--ink-3); }
.mon-btn:active { transform: translateY(1px); }
.mon-btn.primary { background: var(--success); color: #04231a; border-color: transparent; }
.mon-btn.ghost { background: transparent; color: var(--ink-2); }
.mon-btn.shock { background: var(--danger); color: #fff; border-color: transparent; font-weight: 800; }
.mon-btn.shock:disabled { background: var(--surface-2); color: var(--ink-3); cursor: not-allowed; }

/* --- TELA DO MONITOR --- */
.mon-screen {
  background: #06090e; border: 1px solid #17222e; border-radius: 18px;
  padding: 14px 16px 16px; overflow: visible; position: relative;
  box-shadow: inset 0 0 0 1px rgba(70,214,162,.04), 0 20px 50px rgba(0,0,0,.4);
}
.mon-head {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-bottom: 12px; border-bottom: 1px solid #131c26; margin-bottom: 12px;
}
.mon-mini { display: block; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.mon-patient {
  display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12.5px;
  color: var(--ink-2); font-family: 'IBM Plex Mono', monospace;
}
.mon-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px rgba(70,214,162,.18); animation: monPulse 2.4s infinite; }
@keyframes monPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
.mon-rhythm { margin-left: auto; text-align: right; }
.mon-rhythm b { font-size: 15px; font-weight: 800; }
.mon-clock { text-align: right; min-width: 84px; }
.mon-clock b { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: .04em; }
.tone-ok { color: var(--success); } .tone-warn { color: #E7C15A; } .tone-bad { color: var(--danger); }

.mon-body { display: flex; gap: 14px; align-items: stretch; }
.mon-waves { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.mon-lane { position: relative; flex: 1 1 0; min-height: 108px; border-radius: 10px; overflow: hidden; background: #06090e; }
.mon-lane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mon-lane-tag {
  position: absolute; top: 6px; left: 8px; z-index: 2;
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600;
  padding: 2px 7px; border-radius: 6px; background: rgba(6,9,14,.6); letter-spacing: .04em;
}
.mon-lane-tag.t-ecg { color: #46D6A2; } .mon-lane-tag.t-pleth { color: #5AD1E6; } .mon-lane-tag.t-capno { color: #E7C15A; }

/* --- coluna de números --- */
.mon-vitals { flex: 0 0 250px; display: flex; flex-direction: column; gap: 8px; }
.mon-vital {
  background: #080d13; border: 1px solid #131c26; border-radius: 12px;
  padding: 8px 14px 10px; position: relative; overflow: hidden;
}
.mon-vlabel { display: flex; align-items: baseline; gap: 6px; font-weight: 700; font-size: 12px; color: var(--ink-2); letter-spacing: .04em; }
.mon-vlabel small { font-size: 10px; color: var(--ink-3); font-weight: 600; }
.mon-vital b { display: block; font-family: 'IBM Plex Mono', monospace; font-weight: 700; line-height: 1; letter-spacing: .01em; }
.mon-vital > b { font-size: 44px; margin-top: 2px; }
.mon-vital.small > b { font-size: 24px; }
.v-hr b { color: #46D6A2; } .v-pa b { color: #5AD1E6; } .v-spo2 b { color: #5AD1E6; }
.v-etco2 b { color: #E7C15A; } .v-fr b { color: var(--ink); } .v-temp b { color: var(--ink); } .v-shocks b { color: var(--danger); }
.mon-vital-row { display: flex; gap: 8px; }
.mon-vital-row .mon-vital { flex: 1; padding: 7px 10px 9px; }

.mon-vital.alarm-warn { border-color: rgba(231,193,90,.5); }
.mon-vital.alarm-crit { border-color: rgba(230,90,90,.6); animation: monAlarm 1s steps(1) infinite; }
@keyframes monAlarm { 50% { background: rgba(230,90,90,.10); border-color: rgba(230,90,90,.9); } }

/* --- PAINEL DE CONTROLE --- */
.mon-controls { margin-top: 16px; }
.mon-ctl-row { display: flex; gap: 8px; flex-wrap: wrap; }
.mon-toolbar { margin-bottom: 14px; }
.mon-panel {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: 16px; padding: 14px; margin-bottom: 12px;
}
.mon-panel-head {
  font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 12px;
}
.mon-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* teclado de ritmos */
.mon-keypad { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.mon-key {
  display: flex; flex-direction: column; gap: 3px; align-items: flex-start;
  padding: 9px 10px; border-radius: 12px; cursor: pointer; text-align: left;
  background: #0b111a; border: 1px solid var(--line); color: var(--ink);
  transition: transform .08s, border-color .15s, background .15s;
}
.mon-key:hover { border-color: var(--ink-3); }
.mon-key:active { transform: translateY(1px); }
.mon-key-sigla { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 15px; }
.mon-key-nome { font-size: 10.5px; color: var(--ink-2); font-weight: 600; line-height: 1.15; }
.mon-key.tone-ok .mon-key-sigla { color: #46D6A2; } .mon-key.tone-warn .mon-key-sigla { color: #E7C15A; } .mon-key.tone-bad .mon-key-sigla { color: var(--danger); }
.mon-key.active { border-color: var(--success); background: rgba(70,214,162,.12); box-shadow: 0 0 0 1px var(--success); }

/* sliders */
.mon-slider { margin-bottom: 11px; }
.mon-slider label { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
.mon-slider label b { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: var(--ink); font-size: 13px; }
.mon-slider input[type=range] { width: 100%; height: 26px; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
.mon-slider input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: #1a2634; }
.mon-slider input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #1a2634; }
.mon-slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: var(--success); border: 3px solid #06110d; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.mon-slider input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--success); border: 3px solid #06110d; }

/* toggles */
.mon-toggle-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.mon-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-family: inherit; font-weight: 700; font-size: 13px; text-align: left;
  padding: 11px 14px; border-radius: 12px; cursor: pointer;
  background: #0b111a; border: 1px solid var(--line); color: var(--ink-2);
}
.mon-toggle .mon-toggle-dot { width: 34px; height: 20px; border-radius: 999px; background: #1a2634; position: relative; flex: none; transition: background .15s; }
.mon-toggle .mon-toggle-dot::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink-3); transition: transform .15s, background .15s; }
.mon-toggle.on { color: var(--ink); border-color: rgba(70,214,162,.5); }
.mon-toggle.on .mon-toggle-dot { background: rgba(70,214,162,.4); }
.mon-toggle.on .mon-toggle-dot::after { transform: translateX(14px); background: var(--success); }

/* desfibrilação */
.mon-defib { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
.mon-energy { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.mon-j {
  font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 13px;
  padding: 7px 10px; border-radius: 10px; cursor: pointer;
  background: #0b111a; border: 1px solid var(--line); color: var(--ink);
}
.mon-j small { font-size: 9px; color: var(--ink-3); margin-left: 1px; }
.mon-j.active { border-color: #E7C15A; background: rgba(231,193,90,.14); color: #E7C15A; }
.mon-defib-actions { display: flex; gap: 8px; }
.mon-defib-actions .mon-btn { flex: 1; }
.mon-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 10px; line-height: 1.5; }
.mon-disclaimer { font-size: 11px; color: var(--ink-3); margin-top: 6px; text-align: center; line-height: 1.5; }

/* --- PROJEÇÃO / ESPELHO: só a tela, ocupando toda a viewport --- */
body.mirror { background: #000; }
body.mirror .mon-only-control { display: none !important; }
body.mirror .mon-wrap, body.projecting .mon-wrap { max-width: none; padding: 0; }
body.mirror .mon-screen { position: fixed; inset: 0; border-radius: 0; border: 0; height: 100vh; height: 100dvh; }
#mon-screen:fullscreen { border-radius: 0; border: 0; width: 100vw; height: 100vh; padding: 20px 24px; }
#mon-screen:-webkit-full-screen { border-radius: 0; border: 0; width: 100vw; height: 100vh; }
body.mirror .mon-vital:not(.small) > b { font-size: 52px; }
body.mirror .mon-vital.small > b { font-size: 30px; }

/* --- responsivo --- */
@media (max-width: 720px) {
  .mon-body { flex-direction: column; }
  .mon-vitals { flex: none; flex-direction: row; flex-wrap: wrap; }
  .mon-vitals > .mon-vital { flex: 1 1 46%; }
  .mon-vital-row { flex: 1 1 100%; }
  .mon-vital > b { font-size: 38px; }
  .mon-cols { grid-template-columns: 1fr; }
  .mon-lane { min-height: 92px; }
}

/* card de acesso ao Modo Apresentador (home / modos) */
.presenter-card {
  display: flex; gap: 14px; align-items: stretch; margin: 4px 0 6px;
  background: linear-gradient(135deg, rgba(70,214,162,.08), rgba(90,209,230,.05));
  border: 1px solid rgba(70,214,162,.28); border-radius: 18px; padding: 12px;
  transition: transform .1s, border-color .15s;
}
.presenter-card:hover { border-color: rgba(70,214,162,.55); transform: translateY(-1px); }
.presenter-card:active { transform: translateY(0); }
.presenter-mini { flex: 0 0 122px; display: flex; flex-direction: column; gap: 6px; }
.presenter-tag {
  font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  color: var(--success); background: var(--ok-dim); padding: 4px 8px; border-radius: 7px; text-align: center;
}
.presenter-ecg { position: relative; flex: 1; min-height: 70px; border-radius: 10px; overflow: hidden; background: #06090e; border: 1px solid #131c26; }
.presenter-ecg canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.presenter-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.presenter-txt h3 { font-family: var(--font-display, inherit); font-size: 17px; font-weight: 800; color: var(--ink); }
.presenter-txt p { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; margin: 5px 0 8px; }
.presenter-go { font-size: 13px; font-weight: 700; color: var(--success); }
@media (max-width: 480px) {
  .presenter-card { flex-direction: column; }
  .presenter-mini { flex: none; flex-direction: row; align-items: center; }
  .presenter-tag { flex: none; }
  .presenter-ecg { flex: 1; min-height: 54px; }
}

/* ============================================================
   MONITOR · controle direto na tela (faixa + tiles + popovers)
   ============================================================ */
/* reset dos tiles/labels que viraram botões */
button.mon-vital, button.mon-rhythm {
  font: inherit; text-align: left; width: 100%; cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
.mon-rhythm.mon-edit { background: none; border: 0; padding: 0; }
.mon-vital.editable { transition: border-color .12s, transform .08s; }
.mon-vital.editable:hover { border-color: rgba(70,214,162,.4); }
.mon-vital.editable:active { transform: translateY(1px); }
.mon-vital.editable::after {
  content: '✎'; position: absolute; top: 7px; right: 9px;
  font-size: 11px; color: var(--ink-3); opacity: .6;
}
.mon-rhythm.mon-edit { cursor: pointer; }

/* o atributo hidden deve vencer as regras de display abaixo */
.mon-pacer-rate[hidden], .mon-pop[hidden], .mon-pop-bg[hidden] { display: none !important; }

/* faixa de controle rápida no topo da tela */
.mon-strip {
  display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  padding: 10px 0 12px; margin-bottom: 10px; border-bottom: 1px solid #131c26;
}
.mon-chip {
  font-family: inherit; font-weight: 700; font-size: 12.5px;
  padding: 7px 12px; border-radius: 999px; cursor: pointer;
  background: #0b111a; border: 1px solid var(--line); color: var(--ink-2);
  transition: background .12s, border-color .12s, color .12s;
}
.mon-chip:hover { border-color: var(--ink-3); color: var(--ink); }
.mon-chip.accent { background: var(--success); color: #04231a; border-color: transparent; }
.mon-chip.ghost { color: var(--ink-3); }
.mon-chip.toggle.on { background: rgba(70,214,162,.14); border-color: rgba(70,214,162,.5); color: var(--success); }
.mon-pacer-rate { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.mon-pacer-rate b { font-family: 'IBM Plex Mono', monospace; color: var(--ink); }
.mon-mini-step {
  width: 26px; height: 26px; border-radius: 8px; cursor: pointer;
  background: #0b111a; border: 1px solid var(--line); color: var(--ink);
  font-size: 16px; line-height: 1; font-weight: 700;
}

/* tile do desfibrilador (logo abaixo do FR) */
.mon-defib-tile { display: block; }
.mon-defib-tile .mon-vlabel { color: #E7C15A; }
.mon-defib-tile::after { content: '⚡'; color: #E7C15A; opacity: .8; }
.mon-defib-tile-b { display: block; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 16px; color: var(--ink); }
.mon-defib-tile-b small { font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 10.5px; color: var(--ink-3); letter-spacing: 0; }

/* popover de edição */
.mon-pop-bg { position: fixed; inset: 0; background: rgba(3,6,10,.45); z-index: 60; }
.mon-pop {
  position: absolute; z-index: 70; width: 258px;
  background: #0d141d; border: 1px solid #223042; border-radius: 15px;
  padding: 14px; box-shadow: 0 22px 60px rgba(0,0,0,.6);
}
.mon-pop.as-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto;
  border-radius: 20px 20px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
  animation: monSheet .16s ease;
}

      merged.counters = Object.assign({}, base.counters, s.counters || {});

      const savedStats = s.rhythmStats || {};

        let rid = ids[0];
        for (let i = 0; i < ids.length; i++) { r -= pesos[i]; if (r <= 0) { rid = ids[i]; break; } }
        const doRitmo = PRQ.STRIPS.filter(s => s.ritmo === rid);
        cand = pick(doRitmo.length ? doRitmo : pool);
      } else {
        cand = pick(pool);
      }
      // trava anti-fadiga: nunca a mesma tira duas vezes seguidas;
      // em sessão focada (um ritmo só), essa é a única trava que vale.
      const prev1 = out[out.length - 1], prev2 = out[out.length - 2];
      const varias = pool.length > 1;
      if (prev1 && varias && prev1.base.id === cand.id) continue;
      // sem foco: no máx. 2 tiras do mesmo ritmo seguidas (mistura de categorias)
      if (!ritmoFoco && prev1 && prev2 &&
          prev1.base.ritmo === cand.ritmo && prev2.base.ritmo === cand.ritmo) continue;
      out.push({ base: cand, seed: cand.seed + out.length * 997 });
    }
    return out;
  }

  function opcoesResposta(correto, pulso) {
    // 4 alternativas: correta + distratores por confusão clássica
    let ids;
    if (correto === 'aesp') {
      ids = ['aesp', 'sinusal', 'assistolia', 'bradicardia'];
    } else {
      const conf = (PRQ.CONFUSIONS[correto] || []).slice();
      ids = [correto].concat(conf.slice(0, 3));
      if (pulso === false && ids.indexOf('aesp') < 0) {
        ids[ids.length - 1] = 'aesp'; // caso sem pulso sempre oferece AESP
      }
    }
    return shuffle(ids);
  }

    if (id === 'aesp') return PRQ.AESP.nome;
    const r = PRQ.RHYTHMS[id];

  /* ---------- cronômetro ---------- */
  function iniciarTimer(seg, onTimeout) {
    const arc = $('timer-arc'), num = $('timer-num'), ring = $('timer');
    if (!arc) return;
    const C = 2 * Math.PI * 23;
    arc.style.strokeDasharray = C;
    const t0 = performance.now();
    function tick(ts) {
      const dec = (ts - t0) / 1000;
      const resta = Math.max(0, seg - dec);
      arc.style.strokeDashoffset = C * (1 - resta / seg);
      num.textContent = Math.ceil(resta);
      ring.classList.toggle('warn', resta / seg < 0.5 && resta / seg >= 0.25);
      ring.classList.toggle('danger', resta / seg < 0.25);
      if (resta <= 0) { onTimeout(); return; }
      timerRaf = requestAnimationFrame(tick);
    }
    timerRaf = requestAnimationFrame(tick);
  }
  function pararTimer() {
    if (timerRaf) cancelAnimationFrame(timerRaf);
    timerRaf = null;
  }

  /* ============ fluxo por tira ============ */
  function proximaTira() {
    travado = false;
    if (idx >= fila.length) { finalizarRodada(); return; }
    const item = fila[idx];
    renderPlayShell(item);
    if (modo.id === 'arena') { renderArenaBoard(); agendarBots(item); }

    const isCase = modo.id === 'plantao';
    const correto = isCase ? item.ritmoCorreto : item.base.ritmo;
    const pulso = isCase ? item.pulso : undefined;
    renderRespostas(opcoesResposta(correto, pulso), function (resposta, btnEl, ev) {
      pararTimer();
      const tempoMs = performance.now() - tInicioTira;
      if (isCase) responderCaso(item, resposta, tempoMs, btnEl);
      else responderTira(item, resposta, tempoMs, btnEl, ev);
    });

    tInicioTira = performance.now();
    if (modo.timerSeg > 0) {
      iniciarTimer(modo.timerSeg, function () {
        if (travado) return;
        travado = true;
        responderTira(item, null, modo.timerSeg * 1000, null, null); // tempo esgotado
      });
    }
  }

  function marcarBotoes(correto, escolhido) {
    document.querySelectorAll('#answers .answer-btn').forEach(function (b) {
      if (b.dataset.id === correto) b.classList.add('correct');
      else if (b.dataset.id === escolhido) b.classList.add('wrong');
      else b.classList.add('faded');
    });
  }

  /* ---------- resposta em modos de tira ---------- */
  function responderTira(item, resposta, tempoMs, btnEl, ev) {
    const correto = item.base.ritmo;
    const acertou = resposta === correto;
    marcarBotoes(correto, resposta);

    const ganho = computarGanho(acertou, tempoMs);
    aplicarGanho(ganho, acertou, item.base.ritmo, resposta, tempoMs);

    if (acertou && btnEl) {
      const rect = btnEl.getBoundingClientRect();
      const itens = [{ txt: '+' + ganho.xp + ' XP', tipo: 'xp' }];
      if (ganho.moedas) itens.push({ txt: '+' + ganho.moedas + ' ◉' });
      if (ganho.veloc) itens.push({ txt: 'rápido!', tipo: 'xp' });
      ui().burst(rect.left + rect.width / 2, rect.top, itens);
    }
    if (modo.id === 'arena') { pontuarArenaJogador(acertou, tempoMs); renderArenaBoard(); }

    setTimeout(function () {
      abrirFeedbackTira(item, resposta, acertou, ganho, tempoMs);
    }, acertou ? 620 : 780);
  }

  function computarGanho(acertou, tempoMs) {
    if (!acertou) return { xp: -20, moedas: 0, base: 0, veloc: 0, comboB: 0, mult: 1 };
    const timed = modo.timerSeg > 0;
    const base = 100;
    let veloc = 0;
    if (timed && tempoMs < 3000) veloc = 50;
    else if (timed && tempoMs < 6000) veloc = 25;
    const comboNovo = R.combo + 1;
    const comboB = Math.min(100, 10 * (comboNovo - 1));
    const mult = multCombo(comboNovo);
    const xp = Math.round((base + veloc + comboB) * mult * modo.xpFator);
    const moedas = 10 * modo.moedasFator;
    return { xp, moedas, base, veloc, comboB, mult };
  }

  function aplicarGanho(g, acertou, ritmo, resposta, tempoMs) {
    R.total++;
    if (acertou) {
      R.acertos++;
      R.combo++;
      if (R.combo > R.melhorCombo) R.melhorCombo = R.combo;
    } else {
      R.combo = 0;
    }
    R.xp += g.xp;
    R.moedas += g.moedas;
    R.tempos.push(tempoMs);
    const pr = R.porRitmo[ritmo] || (R.porRitmo[ritmo] = { hits: 0, total: 0 });
    pr.total++; if (acertou) pr.hits++;

    st().addXp(g.xp);
    if (g.moedas) st().addMoedas(g.moedas);
    st().registrarTentativa({
      ritmo: ritmo, resposta: resposta || 'tempo esgotado',
      correta: acertou, tempoMs: tempoMs, modo: modo.id, combo: R.combo
    });
    ui().refreshPills();
    atualizarHud();
    ui().celebrarBadges(st().checarBadges());
  }

  function atualizarHud() {
    if ($('hud-xp')) $('hud-xp').textContent = ui().fmt(R.xp);
    if ($('hud-coin')) $('hud-coin').textContent = ui().fmt(R.moedas);
    const cb = $('hud-combo'), box = $('hud-combo-box');
    if (cb) cb.textContent = '×' + R.combo + (multCombo(R.combo) > 1 ? ' · ' + multCombo(R.combo).toFixed(1) : '');
    if (box) {
      box.classList.toggle('hot', R.combo >= 5);
      if (R.combo >= 5) {
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
      }
    }
  }

  /* ---------- Plantão PALS: duas etapas ---------- */
  function responderCaso(caso, respRitmo, tempoMs, btnEl) {
    const ritmoOk = respRitmo === caso.ritmoCorreto;
    marcarBotoes(caso.ritmoCorreto, respRitmo);
    if (ritmoOk && btnEl) {
      const rect = btnEl.getBoundingClientRect();
      ui().burst(rect.left + rect.width / 2, rect.top, [{ txt: 'ritmo ✓', tipo: 'xp' }]);
    }
    // etapa 2: conduta
    setTimeout(function () {
      if (!$('pergunta') || !$('answers')) return; // saiu da partida
      $('pergunta').textContent = 'Conduta inicial (PALS)?';
      const box = $('answers');
      const ordem = shuffle(caso.condutas.map((c, i) => ({ c, i })));
      box.innerHTML = ordem.map(function (o) {
        return '<button class="answer-btn" style="grid-column:1/-1;min-height:52px;text-align:left;padding:12px 16px" data-i="' + o.i + '">' + ui().esc(o.c) + '</button>';
      }).join('');
      travado = false;
      box.querySelectorAll('.answer-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          if (travado) return;
          travado = true;
          const condOk = parseInt(b.dataset.i, 10) === caso.condutaCorreta;
          box.querySelectorAll('.answer-btn').forEach(function (o) {
            const i = parseInt(o.dataset.i, 10);
            if (i === caso.condutaCorreta) o.classList.add('correct');
            else if (o === b) o.classList.add('wrong');
            else o.classList.add('faded');
          });
          setTimeout(function () {
            fecharCaso(caso, respRitmo, ritmoOk, condOk, tempoMs);
          }, 720);
        });
      });
    }, 850);
  }

  function fecharCaso(caso, respRitmo, ritmoOk, condOk, tempoMs) {
    const tudoOk = ritmoOk && condOk;
    // pontuação: ritmo vale como tira; conduta correta soma bônus
    const g = computarGanho(ritmoOk, tempoMs);
    if (condOk) g.xp += Math.round(80 * modo.xpFator);
    if (tudoOk) { R.condutasOk++; st().get().counters.plantaoCondutas++; st().save(); }
    aplicarGanho(g, ritmoOk, caso.ritmoCorreto, respRitmo, tempoMs);

    let html = '<div class="sheet-grip"></div>' +
      '<div class="verdict ' + (tudoOk ? 'ok' : 'bad') + '">' +
        '<div class="verdict-icon">' + ui().icon(tudoOk ? 'check' : 'x') + '</div>' +
        '<div><h3>' + (tudoOk ? 'Caso resolvido' : ritmoOk ? 'Ritmo certo, conduta não' : 'Caso para revisar') + '</h3>' +
        '<span class="microlabel">' + ui().esc(nomeRitmo(caso.ritmoCorreto)) + '</span></div>' +

        grid(cctx, cw.w, cw.h, TINT.capno);
        traceLane(cctx, cpB, cw.w, cw.h, TINT.capno.color, 0.86, 0.66, TINT.capno.glow);
        if (running) sweep(cctx, cw.w, cw.h, ph, TINT.capno.cur);
      }
      raf = requestAnimationFrame(frame);
    }

    function drawSync(ctx, w, h) {
      ctx.fillStyle = 'rgba(90,209,230,0.9)';
      for (var i = 0; i < peaks.length; i++) {
        var x = (peaks[i] / (ecgB.length - 1)) * w;
        ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x - 4, 12); ctx.lineTo(x + 4, 12); ctx.closePath(); ctx.fill();
      }
    }
    function drawPacer(ctx, w, h, s) {
      var rr = 60 / (s.pacerFc || 80), nSp = Math.floor(DUR / rr);
      ctx.strokeStyle = 'rgba(231,193,90,0.9)'; ctx.lineWidth = Math.max(1.4, h * 0.015);
      for (var k = 0; k < nSp; k++) {
        var x = ((k * rr) / DUR) * w;
        ctx.beginPath(); ctx.moveTo(x, h * 0.56); ctx.lineTo(x, h * 0.24); ctx.stroke();
      }
    }
    function drawFlash(ctx, w, h, s) {
      if (!s.flashAt) return;
      var dt = Date.now() - s.flashAt;
      if (dt < 0 || dt > 220) return;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.6 * (1 - dt / 220)).toFixed(3) + ')';
      ctx.fillRect(0, 0, w, h);
    }

    raf = requestAnimationFrame(frame);
    return { stop: function () { stopped = true; if (raf) cancelAnimationFrame(raf); }, invalidate: function () { sig = ''; } };
  }

  /* ---------- render dos números (compartilhado com o espelho) ---------- */
  function fmtPA(s) { return s.pulso && s.pas ? (s.pas + '/' + s.pad) : '--'; }
  function fmtHR(s) {
    var r = ritmo(s.ritmo);
    if (r.hr === 'none') return '--';
    return s.fc ? String(s.fc) : '--';
  }
  function renderNumbers(root, s) {
    root = root || document;
    var r = ritmo(s.ritmo);
    function set(sel, val) { var el = root.querySelector(sel); if (el) el.textContent = val; }
    set('[data-m="hr"]', fmtHR(s));
    set('[data-m="pa"]', fmtPA(s));
    set('[data-m="spo2"]', (s.pulso && s.spo2) ? s.spo2 : '--');
    set('[data-m="etco2"]', s.etco2 ? s.etco2 : '--');
    set('[data-m="fr"]', s.fr ? s.fr : '--');
    set('[data-m="temp"]', s.temp ? s.temp.toFixed(1) : '--');
    set('[data-m="shocks"]', s.choques || 0);
    set('[data-m="ritmo"]', r.nome);
    // classe de alarme por parâmetro
    flag(root, 'hr', alarmHR(s, r));
    flag(root, 'spo2', s.pulso ? (s.spo2 < 90 ? 'crit' : s.spo2 < 94 ? 'warn' : '') : 'crit');
    flag(root, 'pa', s.pulso ? (s.pas < 70 ? 'crit' : '') : 'crit');
    flag(root, 'etco2', s.etco2 && s.etco2 < 20 ? 'warn' : '');
    var badge = root.querySelector('[data-m="ritmo"]');

  }
  function alarmHR(s, r) {
    if (r.hr === 'none' || !s.pulso && r.id !== 'aesp') return 'crit';

    var el = root.querySelector('[data-vital="' + key + '"]');

    if (level === 'warn') el.classList.add('alarm-warn');
    if (level === 'crit') el.classList.add('alarm-crit');
  }

  return {
    RITMOS: RITMOS, ritmo: ritmo, preset: preset,
    createEngine: createEngine, renderNumbers: renderNumbers,
    fmtHR: fmtHR, fmtPA: fmtPA
  };
})();

        '<div class="avatar">' + p.avatar + '</div>' +

        '<span class="rankpts">' + ui.fmt(p.pts) + '</span>' +
        deltaHtml +
      '</div>';
    }).join('');

})();

'emblemas.html': function () {

(function () {
  var ui = PRQ.ui, st = PRQ.state;
  ui.renderShell();
  var filtro = 'todos';
  var novos = [];

  ui.garantirPerfil(function () {
    novos = st.consumirBadgesNovos();
    render();
  });

  document.getElementById('bd-filters').addEventListener('click', function (e) {
    var b = e.target.closest('.filter-btn');
    if (!b) return;
    document.querySelectorAll('#bd-filters .filter-btn').forEach(function (o) { o.classList.remove('active'); });
    b.classList.add('active');
    filtro = b.dataset.f;
    render();
  });

  function render() {
    var S = st.get();
    document.getElementById('bd-count').textContent = S.badges.length + ' de ' + PRQ.BADGES.length;

    var lista = PRQ.BADGES.filter(function (b) {
      var tem = S.badges.indexOf(b.id) >= 0;
      if (filtro === 'conquistados') return tem;
      if (filtro === 'progresso') return !tem && st.progressoBadge(b) > 0;
      return true;
    });

    document.getElementById('badgegrid').innerHTML = lista.length
      ? lista.map(function (b) {
          var tem = S.badges.indexOf(b.id) >= 0;
          var prog = Math.min(b.meta, st.progressoBadge(b));
          var pct = (prog / b.meta) * 100;
          var fresh = novos.indexOf(b.id) >= 0;
          return '<button class="badgetile ' + (tem ? 'unlocked' : 'locked') + (b.special ? ' special' : '') + (fresh ? ' fresh' : '') + '" data-id="' + b.id + '">' +
            '<div class="badge-emoji">' + b.emoji + '</div>' +
            '<h4>' + ui.esc(b.nome) + '</h4>' +
            '<span class="microlabel">' + (tem ? 'desbloqueado' : b.meta > 1 ? prog + ' / ' + b.meta : 'bloqueado') + '</span>' +
            (b.special ? '<span class="badge-stoptag">selo STOP</span>' : '') +
            (!tem && b.meta > 1 ? '<div class="meter reward"><i style="width:' + pct.toFixed(0) + '%"></i></div>' : '') +
          '</button>';
        }).join('')
      : '<p class="small muted" style="grid-column:1/-1;text-align:center;padding:26px 0">Nada aqui ainda. Jogue uma rodada para começar a coleção.</p>';

    document.querySelectorAll('.badgetile').forEach(function (t) {
      t.addEventListener('click', function () { abrirDetalhe(t.dataset.id); });
    });
  }

  function abrirDetalhe(id) {
    var S = st.get();
    var b = PRQ.BADGES.filter(function (x) { return x.id === id; })[0];
    if (!b) return;
    var tem = S.badges.indexOf(b.id) >= 0;
    var prog = Math.min(b.meta, st.progressoBadge(b));
    var pct = (prog / b.meta) * 100;
    var moldura = b.special
      ? 'background:linear-gradient(150deg,rgba(158,130,214,.28),rgba(75,190,193,.16));border:1px solid rgba(75,190,193,.5)'
      : 'background:linear-gradient(150deg,rgba(195,178,230,.28),rgba(195,178,230,.08));border:1px solid rgba(195,178,230,.5)';
    ui.modal(
      '<div class="center">' +
        '<div class="badge-emoji" style="width:74px;height:74px;font-size:38px;margin:0 auto 12px;' +
          (tem ? moldura : 'filter:grayscale(1);opacity:.5;border:1px solid var(--line)') + '">' + b.emoji + '</div>' +
        '<h3 class="display" style="font-size:20px">' + ui.esc(b.nome) + '</h3>' +
        '<span class="microlabel" style="' + (tem ? 'color:var(--reward)' : '') + '">' + (tem ? 'desbloqueado' : 'em progresso') + '</span>' +
        (b.special ? '<div style="margin-top:8px"><span class="badge-stoptag">chancelado pela STOP</span></div>' : '') +
      '</div>' +
      '<div class="kv mt-14"><span class="microlabel">critério</span><b>' + ui.esc(b.criterio) + '</b></div>' +
      '<p class="small" style="color:var(--ink-2);margin-top:12px;line-height:1.55">' + ui.esc(b.descricao) + '</p>' +
      (!tem && b.meta > 1
        ? '<div class="mt-14"><div class="meter reward"><i style="width:' + pct.toFixed(0) + '%"></i></div>' +
          '<p class="small muted center mt-8 mono">' + prog + ' / ' + b.meta + '</p></div>'
        : '') +
      '<button class="btn btn-ghost btn-block mt-14" data-close>Fechar</button>'
    );
  }
})();
