<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PALS Rhythm Quest · Monitor de simulação</title>
<meta name="theme-color" content="#06090e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monitor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A0E14'/%3E%3Cpath d='M3 12h4l2.5-6 4 12 2.5-6h5' stroke='%2346D6A2' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="mon-page">

<main class="mon-wrap">

  <div class="mon-bar mon-only-control" id="mon-bar">
    <a class="mon-back" href="index.html" aria-label="Voltar">‹ Sair</a>
    <span class="mon-title">Monitor de simulação <small>modo apresentador</small></span>
    <div class="mon-bar-actions">
      <button class="mon-btn" id="c-mirror" title="Abrir tela de projeção espelhada">Espelhar</button>
      <button class="mon-btn" id="c-fs" title="Tela cheia para projeção">Tela cheia</button>
    </div>
  </div>

  <!-- TELA DO MONITOR (é o que se projeta e onde tudo é operado) -->
  <section class="mon-screen" id="mon-screen">
    <div class="mon-head">
      <div class="mon-patient"><span class="mon-dot"></span>Paciente pediátrico · simulação</div>
      <button class="mon-rhythm mon-edit" data-edit="ritmo"><span class="mon-mini">ritmo<span class="mon-only-control"> · tocar p/ mudar</span></span><b data-m="ritmo" class="tone-ok">Ritmo sinusal</b></button>
      <div class="mon-clock"><span class="mon-mini">tempo</span><b data-m="timer">00:00</b></div>
    </div>

    <!-- faixa de controle rápida (some na projeção espelhada) -->
    <div class="mon-strip mon-only-control" id="mon-strip">
      <button class="mon-chip" id="c-run">▶ Iniciar</button>
      <button class="mon-chip" id="c-reset-time">⟲ Zerar tempo</button>
      <button class="mon-chip toggle on" id="t-pulso">Pulso</button>
      <button class="mon-chip toggle" id="t-sync">SYNC</button>
      <button class="mon-chip toggle" id="t-pacer">PACER</button>
      <span class="mon-pacer-rate" id="row-pacer" hidden>
        <button class="mon-mini-step" data-pacer="-5">−</button>
        <b><span data-out="pacerFc">80</span> ppm</b>
        <button class="mon-mini-step" data-pacer="5">+</button>
      </span>
      <button class="mon-chip ghost" id="c-reset-all">Restaurar</button>
    </div>

    <div class="mon-body">
      <div class="mon-waves">
        <div class="mon-lane"><span class="mon-lane-tag t-ecg">ECG · DII</span><canvas id="mon-ecg"></canvas></div>
        <div class="mon-lane"><span class="mon-lane-tag t-pleth">Pleth · SpO₂</span><canvas id="mon-pleth"></canvas></div>
        <div class="mon-lane"><span class="mon-lane-tag t-capno">Capno · CO₂</span><canvas id="mon-capno"></canvas></div>
      </div>

      <div class="mon-vitals">
        <button class="mon-vital v-hr editable" data-vital="hr" data-edit="fc">
          <span class="mon-vlabel">FC<small>bpm</small></span><b data-m="hr">110</b>
        </button>
        <button class="mon-vital v-pa editable" data-vital="pa" data-edit="pa">
          <span class="mon-vlabel">PA<small>mmHg</small></span><b data-m="pa">95/60</b>
        </button>
        <button class="mon-vital v-spo2 editable" data-vital="spo2" data-edit="spo2">
          <span class="mon-vlabel">SpO₂<small>%</small></span><b data-m="spo2">98</b>
        </button>
        <button class="mon-vital v-etco2 editable" data-vital="etco2" data-edit="etco2">
          <span class="mon-vlabel">EtCO₂<small>mmHg</small></span><b data-m="etco2">35</b>
        </button>
        <div class="mon-vital-row">
          <button class="mon-vital v-fr small editable" data-vital="fr" data-edit="fr"><span class="mon-vlabel">FR<small>rpm</small></span><b data-m="fr">24</b></button>
          <button class="mon-vital v-temp small editable" data-edit="temp"><span class="mon-vlabel">Temp<small>°C</small></span><b data-m="temp">37.0</b></button>
          <div class="mon-vital v-shocks small"><span class="mon-vlabel">Choques</span><b data-m="shocks">0</b></div>
        </div>
        <!-- Desfibrilador logo abaixo do FR -->
        <button class="mon-vital mon-defib-tile mon-only-control" data-edit="defib">
          <span class="mon-vlabel">Desfibrilador</span>
          <span class="mon-defib-tile-b">⚡ <span data-m="energia-lbl">20</span> J <small>· tocar para carregar/chocar</small></span>
        </button>
      </div>
    </div>

    <!-- popover de edição (aparece sobre a tela, sem rolar) -->
    <div class="mon-pop-bg" id="mon-pop-bg" hidden></div>
    <div class="mon-pop" id="mon-pop" hidden></div>
  </section>

  <p class="mon-disclaimer mon-only-control">Ferramenta educacional. Toque em um valor para ajustar. Traçados sintéticos — não substituem monitor clínico real.</p>

</main>

<script src="js/ecg.js"></script>
<script src="js/monitor.js"></script>
<script>
(function () {
  var M = PRQ.monitor;
  var CH = 'prq-monitor', LS = 'prq-monitor-state';
  var singleFile = !!(window.PRQ && PRQ.route);
  var isMirror = (function () {
    var h = (PRQ.route && PRQ.route.search) || location.search || '';
    return /view=mirror/.test(h) || /[?&]mirror/.test(location.hash);
  })();

  var ENERGIAS = [2, 4, 10, 20, 50, 70, 100, 150, 200];
  var screenEl = document.getElementById('mon-screen');
  var pop = document.getElementById('mon-pop'), popBg = document.getElementById('mon-pop-bg');
  // ancora o popover no body: garante position:fixed relativo à viewport
  // (o #mon-screen cria bloco de contenção). Em tela cheia, movemos p/ a tela.
  function popParent() { return document.fullscreenElement || document.body; }
  function reparentPop() { var p = popParent(); p.appendChild(popBg); p.appendChild(pop); }
  document.body.appendChild(popBg); document.body.appendChild(pop);

  var state = defaults();
  function defaults() {
    var p = M.preset('sinusal');
    p.running = false; p.seed = 7; p.choques = 0; p.energia = 20;
    p.pulso = true; p.sync = false; p.pacer = false; p.pacerFc = 80;
    p.elapsedMs = 0; p.startedAt = Date.now(); p.charged = false;
    return p;
  }

  /* --- sincronização controle → espelho --- */
  var bc = null;
  try { bc = ('BroadcastChannel' in window) ? new BroadcastChannel(CH) : null; } catch (e) { bc = null; }
  function broadcast() {
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    if (bc) { try { bc.postMessage(state); } catch (e) {} }
  }
  function loadShared() { try { var s = JSON.parse(localStorage.getItem(LS)); if (s) state = s; } catch (e) {} }

  /* --- motor de ondas --- */
  var engine = M.createEngine({
    ecg: document.getElementById('mon-ecg'),
    pleth: document.getElementById('mon-pleth'),
    capno: document.getElementById('mon-capno'),
    getState: function () { return state; }
  });

  /* --- relógio --- */
  function elapsed() { return state.running ? state.elapsedMs + (Date.now() - state.startedAt) : state.elapsedMs; }
  function timerText() { var s = Math.floor(elapsed() / 1000), m = Math.floor(s / 60); s = s % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  setInterval(function () { var el = document.querySelector('[data-m="timer"]'); if (el) el.textContent = timerText(); }, 250);

  function paint() {
    M.renderNumbers(document, state);
    var e = document.querySelector('[data-m="energia-lbl"]'); if (e) e.textContent = state.energia;
  }

  /* ============================================================
     ESPELHO: só a tela, recebe estado
     ============================================================ */
  if (isMirror) {
    document.body.classList.add('mirror');
    loadShared(); engine.invalidate(); paint();
    function onMsg(s) { if (s) { state = s; engine.invalidate(); paint(); } }
    if (bc) bc.onmessage = function (e) { onMsg(e.data); };
    window.addEventListener('storage', function (e) { if (e.key === LS && e.newValue) { try { onMsg(JSON.parse(e.newValue)); } catch (err) {} } });
    return;
  }

  /* ============================================================
     CONTROLE
     ============================================================ */
  function commit() { paint(); syncStrip(); broadcast(); }

  function syncStrip() {
    var run = document.getElementById('c-run');
    run.textContent = state.running ? '⏸ Pausar' : '▶ Iniciar';
    run.classList.toggle('accent', !state.running);
    tog('t-pulso', state.pulso); tog('t-sync', state.sync); tog('t-pacer', state.pacer);
    document.getElementById('row-pacer').hidden = !state.pacer;
    var pr = document.querySelector('[data-out="pacerFc"]'); if (pr) pr.textContent = state.pacerFc;
  }
  function tog(id, on) { var b = document.getElementById(id); if (b) b.classList.toggle('on', !!on); }

  /* ---------- POPOVERS ---------- */
  var VIT = {
    fc:   { label: 'FC', unit: 'bpm', min: 0, max: 300, step: 5, get: function () { return state.fc; }, set: function (v) { state.fc = v; engine.invalidate(); } },
    spo2: { label: 'SpO₂', unit: '%', min: 40, max: 100, step: 1, get: function () { return state.spo2; }, set: function (v) { state.spo2 = v; } },
    etco2:{ label: 'EtCO₂', unit: 'mmHg', min: 0, max: 80, step: 1, get: function () { return state.etco2; }, set: function (v) { state.etco2 = v; engine.invalidate(); } },
    fr:   { label: 'FR', unit: 'rpm', min: 0, max: 70, step: 2, get: function () { return state.fr; }, set: function (v) { state.fr = v; engine.invalidate(); } },
    temp: { label: 'Temperatura', unit: '°C', min: 32, max: 42, step: 0.1, float: true, get: function () { return state.temp; }, set: function (v) { state.temp = v; } }
  };

  function closePop() { pop.hidden = true; popBg.hidden = true; pop.innerHTML = ''; }
  popBg.addEventListener('click', closePop);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });

  function placePop(anchor) {
    var mobile = window.matchMedia('(max-width: 720px)').matches;
    pop.classList.toggle('as-sheet', mobile);
    if (mobile) { pop.style.left = ''; pop.style.top = ''; return; }
    // pop é fixed relativo à viewport: usa coordenadas de viewport da âncora
    var ar = anchor.getBoundingClientRect();
    var w = 258, vw = window.innerWidth, vh = window.innerHeight;
    var left = Math.max(8, Math.min(ar.left, vw - w - 8));
    var top = Math.min(ar.bottom + 8, vh - 40);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  function openPop(html, anchor) {
    reparentPop();
    pop.innerHTML = html + '<button class="mon-pop-ok" data-close>Concluir</button>';
    pop.hidden = false; popBg.hidden = false;
    placePop(anchor);
    pop.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closePop); });
  }

  // editor numérico genérico
  function editNum(key, anchor) {
    var c = VIT[key];
    var html =
      '<div class="mon-pop-head">' + c.label + ' <small>' + c.unit + '</small></div>' +
      '<div class="mon-pop-val">' +
        '<button class="mon-pop-step" data-d="-1">−</button>' +
        '<b id="pop-val"></b>' +
        '<button class="mon-pop-step" data-d="1">+</button>' +
      '</div>' +
      '<input type="range" id="pop-range" min="' + c.min + '" max="' + c.max + '" step="' + c.step + '">';
    openPop(html, anchor);
    var out = pop.querySelector('#pop-val'), rng = pop.querySelector('#pop-range');
    function show() { var v = c.get(); out.textContent = c.float ? (+v).toFixed(1) : v; rng.value = v; }
    function change(v) { v = Math.max(c.min, Math.min(c.max, +v)); if (c.float) v = Math.round(v * 10) / 10; c.set(v); show(); commit(); }
    show();
    pop.querySelectorAll('.mon-pop-step').forEach(function (b) {
      b.addEventListener('click', function () { change(c.get() + (+b.dataset.d) * c.step); });
    });
    rng.addEventListener('input', function () { change(rng.value); });
  }

  // editor de PA (sistólica + diastólica)
  function editPA(anchor) {
    var html =
      '<div class="mon-pop-head">Pressão arterial <small>mmHg</small></div>' +
      paRow('Sistólica', 'pas', 30, 180) + paRow('Diastólica', 'pad', 15, 120);
    openPop(html, anchor);
    ['pas', 'pad'].forEach(function (k) {
      var out = pop.querySelector('#o-' + k), rng = pop.querySelector('#r-' + k);
      function show() { out.textContent = state[k]; rng.value = state[k]; }
      function change(v) { state[k] = Math.max(+rng.min, Math.min(+rng.max, +v)); show(); commit(); }
      show();
      pop.querySelectorAll('[data-k="' + k + '"]').forEach(function (b) { b.addEventListener('click', function () { change(state[k] + (+b.dataset.d) * 5); }); });
      rng.addEventListener('input', function () { change(rng.value); });
    });
  }
  function paRow(label, k, min, max) {
    return '<div class="mon-pop-sub">' + label + '</div>' +
      '<div class="mon-pop-val small">' +
        '<button class="mon-pop-step" data-k="' + k + '" data-d="-1">−</button>' +
        '<b id="o-' + k + '"></b>' +
        '<button class="mon-pop-step" data-k="' + k + '" data-d="1">+</button>' +
      '</div>' +
      '<input type="range" id="r-' + k + '" min="' + min + '" max="' + max + '" step="1">';
  }

  // editor de ritmo (teclado)
  function editRitmo(anchor) {
    var html = '<div class="mon-pop-head">Ritmo cardíaco</div><div class="mon-keypad pop">' +
      M.RITMOS.map(function (r) {
        return '<button class="mon-key tone-' + r.tom + (r.id === state.ritmo ? ' active' : '') + '" data-r="' + r.id + '">' +
          '<span class="mon-key-sigla">' + r.sigla + '</span><span class="mon-key-nome">' + r.nome + '</span></button>';
      }).join('') + '</div>';
    openPop(html, anchor);
    pop.querySelectorAll('.mon-key').forEach(function (b) {
      b.addEventListener('click', function () {
        aplicarRitmo(b.dataset.r); closePop();
      });
    });
  }
  function aplicarRitmo(id) {
    var novo = M.preset(id);
    novo.running = true; novo.seed = (state.seed || 7) + 1;
    novo.choques = state.choques; novo.energia = state.energia;
    novo.sync = state.sync; novo.pacer = state.pacer; novo.pacerFc = state.pacerFc;
    novo.elapsedMs = state.elapsedMs; novo.charged = state.charged;
    novo.startedAt = state.running ? state.startedAt : Date.now();
    state = novo; engine.invalidate(); commit();
  }

  // editor do desfibrilador
  function editDefib(anchor) {
    var html =
      '<div class="mon-pop-head">Desfibrilação</div>' +
      '<div class="mon-pop-sub">Energia (J)</div>' +
      '<div class="mon-energy pop">' + ENERGIAS.map(function (j) {
        return '<button class="mon-j' + (j === state.energia ? ' active' : '') + '" data-j="' + j + '">' + j + '<small>J</small></button>';
      }).join('') + '</div>' +
      '<div class="mon-defib-actions">' +
        '<button class="mon-btn" id="p-charge">Carregar</button>' +
        '<button class="mon-btn shock" id="p-shock"' + (state.charged ? '' : ' disabled') + '>⚡ CHOQUE</button>' +
      '</div>' +
      '<p class="mon-hint">Choques: <b data-m="shocks">' + (state.choques || 0) + '</b> · Pediátrico: 2 J/kg (1º) e 4 J/kg (seguintes). Cardioversão sincr. 0,5–1 J/kg.</p>';
    openPop(html, anchor);
    pop.querySelectorAll('.mon-j').forEach(function (b) {
      b.addEventListener('click', function () {
        state.energia = +b.dataset.j; state.charged = false;
        pop.querySelectorAll('.mon-j').forEach(function (o) { o.classList.remove('active'); });
        b.classList.add('active');
        document.getElementById('p-shock').disabled = true;
        document.getElementById('p-shock').textContent = '⚡ CHOQUE';
        commit();
      });
    });
    var charge = pop.querySelector('#p-charge'), shock = pop.querySelector('#p-shock');
    charge.addEventListener('click', function () {
      charge.disabled = true; charge.textContent = 'Carregando…';
      setTimeout(function () {
        state.charged = true; charge.disabled = false; charge.textContent = 'Carregado ✓';
        shock.disabled = false; shock.textContent = '⚡ CHOQUE ' + state.energia + 'J';
        commit();
      }, 900);
    });
    shock.addEventListener('click', function () {
      if (!state.charged) return;
      state.choques = (state.choques || 0) + 1; state.charged = false; state.flashAt = Date.now();
      shock.disabled = true; shock.textContent = '⚡ CHOQUE';
      charge.textContent = 'Carregar';
      var sc = pop.querySelector('[data-m="shocks"]'); if (sc) sc.textContent = state.choques;
      commit();
    });
  }

  // roteamento de cliques nos tiles / ritmo
  screenEl.addEventListener('click', function (e) {
    var t = e.target.closest('[data-edit]'); if (!t) return;
    var k = t.dataset.edit;
    if (k === 'pa') editPA(t);
    else if (k === 'ritmo') editRitmo(t);
    else if (k === 'defib') editDefib(t);
    else if (VIT[k]) editNum(k, t);
  });

  /* ---------- faixa de controle ---------- */
  document.getElementById('c-run').addEventListener('click', function () {
    if (state.running) { state.elapsedMs += Date.now() - state.startedAt; state.running = false; }
    else { state.startedAt = Date.now(); state.running = true; }
    commit();
  });
  document.getElementById('c-reset-time').addEventListener('click', function () { state.elapsedMs = 0; state.startedAt = Date.now(); commit(); });
  document.getElementById('c-reset-all').addEventListener('click', function () { state = defaults(); engine.invalidate(); commit(); });
  document.getElementById('t-pulso').addEventListener('click', function () { state.pulso = !state.pulso; commit(); });
  document.getElementById('t-sync').addEventListener('click', function () { state.sync = !state.sync; commit(); });
  document.getElementById('t-pacer').addEventListener('click', function () { state.pacer = !state.pacer; commit(); });
  document.querySelectorAll('[data-pacer]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.pacerFc = Math.max(40, Math.min(180, state.pacerFc + (+b.dataset.pacer)));
      commit();
    });
  });

  /* ---------- espelhar / tela cheia ---------- */
  document.getElementById('c-mirror').addEventListener('click', function () {
    broadcast();
    if (singleFile) { alert('No arquivo único, use "Tela cheia". A janela-espelho funciona na versão hospedada do site.'); return; }
    window.open('monitor.html?view=mirror', 'prq-mirror', 'width=1280,height=800');
  });
  document.getElementById('c-fs').addEventListener('click', function () {
    var el = document.getElementById('mon-screen');
    if (!document.fullscreenElement) {
      document.body.classList.add('projecting');
      (el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen && el.webkitRequestFullscreen()));
    } else { document.body.classList.remove('projecting'); document.exitFullscreen && document.exitFullscreen(); }
  });
  document.addEventListener('fullscreenchange', function () {
    closePop(); // evita popover órfão ao trocar de contexto
    if (!document.fullscreenElement) document.body.classList.remove('projecting');
  });

  loadShared(); engine.invalidate(); commit();
})();
</script>
</body>
</html>
