<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PALS Rhythm Quest · Liga STOP</title>
<meta name="theme-color" content="#0A0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A0E14'/%3E%3Cpath d='M3 12h4l2.5-6 4 12 2.5-6h5' stroke='%2346D6A2' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>

<main class="app">
  <div class="section-head mt-0">
    <div>
      <span class="microlabel">liga da turma · chancelada pela STOP</span>
      <h2 class="section-title" style="font-size:24px;margin-top:4px">Liga STOP</h2>
    </div>
    <span class="chip institutional" id="rk-fim"></span>
  </div>
  <p class="small muted mb-14">Todos disputam com as mesmas tiras. A pontuação é o XP acumulado na semana; zera toda segunda-feira.</p>

  <div class="podium" id="podium"></div>
  <section class="card card-tight"><div class="ranklist" id="ranklist"></div></section>

  <footer class="disclaimer">
    <b>Demonstração</b><br>
    Ranking com participantes simulados para o protótipo. Na produção, cada sala reúne a turma, liga ou curso reais.
  </footer>
</main>

<script src="js/data.js"></script>
<script src="js/ecg.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var ui = PRQ.ui, st = PRQ.state;
  ui.renderShell();
  ui.garantirPerfil(render);

  function render() {
    var S = st.get();

    // dias até domingo
    var hoje = new Date();
    var faltam = (7 - ((hoje.getDay() + 6) % 7 + 1)) % 7;
    document.getElementById('rk-fim').textContent =
      faltam === 0 ? 'termina hoje' : 'termina em ' + faltam + (faltam === 1 ? ' dia' : ' dias');

    var eu = {
      nome: S.nome || 'Você', avatar: S.avatar, turma: 'sua semana',
      pts: S.weekly.xp, delta: 0, eu: true
    };
    var todos = PRQ.RANKING_MOCK.concat([eu]).sort(function (a, b) { return b.pts - a.pts; });

    // pódio top 3
    var ordem = [1, 0, 2]; // segundo, primeiro, terceiro
    var classes = ['second', 'first', 'third'];
    document.getElementById('podium').innerHTML = ordem.map(function (oi, i) {
      var p = todos[oi];
      if (!p) return '<div></div>';
      return '<div class="podium-card ' + classes[i] + (p.eu ? '" style="border-color:rgba(42,212,165,.5)' : '') + '">' +
        '<span class="podium-medal">' + (oi + 1) + '</span>' +
        '<div class="avatar">' + p.avatar + '</div>' +
        '<div class="podium-name">' + ui.esc(p.nome) + '</div>' +
        '<div class="podium-pts">' + ui.fmt(p.pts) + ' XP</div>' +
      '</div>';
    }).join('');

    // lista completa (4º em diante) com você destacado
    document.getElementById('ranklist').innerHTML = todos.slice(3).map(function (p, i) {
      var pos = i + 4;
      var deltaHtml = p.eu ? '' :
        p.delta > 0 ? '<span class="rankdelta up">▲' + p.delta + '</span>' :
        p.delta < 0 ? '<span class="rankdelta down">▼' + (-p.delta) + '</span>' :
        '<span class="rankdelta same">·</span>';
      return '<div class="rankrow' + (p.eu ? ' me' : '') + '">' +
        '<span class="rankpos">' + pos + '</span>' +
        '<div class="avatar">' + p.avatar + '</div>' +
        '<div class="rankmain"><div class="name">' + ui.esc(p.nome) + '</div><div class="sub">' + ui.esc(p.turma) + '</div></div>' +
        '<span class="rankpts">' + ui.fmt(p.pts) + '</span>' +
        deltaHtml +
      '</div>';
    }).join('');
  }
})();
</script>
</body>
</html>
